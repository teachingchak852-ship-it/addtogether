<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合起來！快樂學加法</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#222;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:2rem;margin:10px 0 20px;text-align:center}
.settings-bar{display:flex;gap:12px;align-items:center;justify-content:center;background:#f9f9f9;padding:12px 20px;border:1px solid #ddd;border-radius:12px;margin-bottom:20px;flex-wrap:wrap}
.settings-bar label{font-size:1.1rem;font-weight:700}
select,.settings-bar button{font-size:1.1rem;padding:7px 12px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}
.game-container{width:100%;max-width:800px;display:flex;flex-direction:column;gap:18px}
.top-panels{display:flex;gap:20px}.panel{flex:1;min-width:0;border:2px solid #ccc;border-radius:16px;padding:15px;min-height:180px;display:flex;flex-direction:column;align-items:center}
.panel-header{font-size:1.3rem;font-weight:700;margin-bottom:10px}.text-blue{color:#0056b3}.text-orange{color:#c45c00}.text-green{color:#16803d}
.items-box{flex:1;width:100%;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;min-height:100px}
.item{width:55px;height:55px;font-size:2.2rem;display:flex;justify-content:center;align-items:center;border:1.5px solid #bbb;border-radius:12px;background:#fff;cursor:pointer;touch-action:manipulation}
.item:hover:not(.placed){background:#f0f0f0;transform:scale(1.04)}.item:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.item.placed{cursor:default}
/* 大籃子：籐籃造型，物件真正放在籃內 */
.bottom-basket{border:2px solid #edd9be;border-radius:22px;background:#fffaf3;padding:18px 15px 10px;min-height:325px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.bottom-basket.drag-over{background:#ecfdf3;border-color:#16a34a}
.basket-header{font-size:1.35rem;font-weight:700;text-align:center;margin-bottom:0;position:relative;z-index:5}
.basket-stage{width:min(100%,600px);height:270px;position:relative;margin:6px auto 0;display:flex;align-items:flex-end;justify-content:center}
.basket-handle{position:absolute;top:4px;left:24%;width:52%;height:145px;border:15px solid #ae7137;border-bottom:0;border-radius:50% 50% 0 0;box-shadow:inset 0 5px #e2b77a,0 3px 0 #875222;z-index:0}
.basket-body{position:absolute;bottom:7px;left:6%;width:88%;height:185px;clip-path:polygon(0 0,100% 0,91% 100%,9% 100%);border-radius:12px 12px 52px 52px;background-color:#d9a25e;background-image:repeating-linear-gradient(0deg,transparent 0 15px,rgba(116,66,21,.28) 16px 20px),repeating-linear-gradient(90deg,rgba(255,238,197,.3) 0 17px,rgba(134,76,32,.12) 18px 22px);box-shadow:inset 0 -18px 16px #a76e35;z-index:1}
.basket-rim{position:absolute;bottom:179px;left:5%;width:90%;height:25px;border-radius:50%;background:repeating-linear-gradient(90deg,#a56a32 0 17px,#edc28b 17px 30px);border:4px solid #8d5529;z-index:2;box-shadow:0 3px 3px #85542944}
.basket-stage .items-box{position:absolute;bottom:23px;left:12%;width:76%;height:153px;min-height:0;display:flex;align-content:center;align-items:center;justify-content:center;gap:5px 8px;padding:5px;z-index:3;pointer-events:none}
.basket-stage .item{width:48px;height:48px;font-size:2rem;background:#fffdf7ed;box-shadow:0 2px 3px #70451a44;pointer-events:none}
/* 放進籃子的每件物件下方顯示點數 */
.basket-stage .item.placed{height:62px;width:54px;flex-direction:column;gap:0;padding:2px 0;border:1.5px solid #b78a51;line-height:1;}
.placed-icon{font-size:1.75rem;line-height:1.1;display:block;}
.placed-number{font-size:1.1rem;font-weight:800;color:#174d91;line-height:1.1;display:block;font-variant-numeric:tabular-nums;}
.basket-stage .hint{font-size:1rem;color:#523315;background:#fff9e7e8;padding:9px 13px;border-radius:13px;max-width:92%}
.bottom-basket.drag-over .basket-body{filter:brightness(1.13)}
.hint{color:#777;font-size:1.1rem;align-self:center;text-align:center}
.result-banner{background:#f8fafc;border:2px solid #cbd5e1;border-radius:16px;padding:18px;text-align:center;font-size:2rem;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.status{text-align:center;font-size:1.15rem;font-weight:700;min-height:1.5em;color:#17613d}
.action-btns{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}.btn{font-size:1.2rem;padding:10px 24px;border-radius:12px;border:2px solid #333;background:#fff;font-weight:700;cursor:pointer}.btn-primary{background:#2563eb;color:#fff;border-color:#1d4ed8}.btn:disabled{opacity:.42;cursor:not-allowed}.btn:not(:disabled):hover{filter:brightness(.94)}
@media(max-width:600px){.top-panels{flex-direction:column}h1{font-size:1.55rem}.result-banner{font-size:1.5rem}.item{width:50px;height:50px;font-size:2rem}.basket-stage{height:240px}.basket-body{height:170px}.basket-rim{bottom:164px}.basket-stage .items-box{bottom:20px;height:140px;gap:3px}.basket-stage .item{width:39px;height:39px;font-size:1.65rem}.basket-stage .item.placed{width:43px;height:56px}.placed-icon{font-size:1.5rem}.placed-number{font-size:1rem}.basket-handle{height:128px;border-width:12px}}
</style>
</head>
<body>
<h1>合起來！學習加法概念</h1>
<div class="settings-bar">
<label for="maxSelect">題目範圍：</label>
<select id="maxSelect"><option value="5">5 以內</option><option value="10">10 以內</option></select>
<span id="objectName" aria-live="polite">本題物件：蘋果 🍎</span>
<button id="restartBtn">🔄 重新開始</button>
</div>
<main class="game-container">
<div class="top-panels">
<section class="panel"><div class="panel-header">左邊：<span id="leftCountDisplay" class="text-blue"></span></div><div class="items-box" id="leftBox"></div></section>
<section class="panel"><div class="panel-header">右邊：<span id="rightCountDisplay" class="text-orange"></span></div><div class="items-box" id="rightBox"></div></section>
</div>
<section class="bottom-basket" id="basketBox"><div class="basket-header">合起來的大籃子（已放：<span id="basketCountDisplay" class="text-green">0</span>）</div><div class="basket-stage" aria-label="籐織大籃子"><div class="basket-handle" aria-hidden="true"></div><div class="basket-body" aria-hidden="true"></div><div class="basket-rim" aria-hidden="true"></div><div class="items-box" id="basketItemsBox" aria-live="polite"></div></div></section>
<div class="result-banner"><span id="resLeft" class="text-blue"></span> 和 <span id="resRight" class="text-orange"></span> 合起來，全部有 <span id="resTotal" class="text-green">0</span>。</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div class="action-btns"><button class="btn" id="speakBtn" disabled>🔊 再讀一次</button><button class="btn btn-primary" id="nextBtn" disabled>➡️ 下一題</button></div>
</main>
<script>
'use strict';
const objects=[
 {name:'蘋果',icon:'🍎'},{name:'香蕉',icon:'🍌'},{name:'士多啤梨',icon:'🍓'},
 {name:'車仔',icon:'🚗'},{name:'小狗',icon:'🐶'},{name:'橙',icon:'🍊'},
 {name:'星星',icon:'⭐'},{name:'氣球',icon:'🎈'},{name:'花朵',icon:'🌸'},
 {name:'足球',icon:'⚽'}
];
const $=id=>document.getElementById(id);
let left=3,right=2,total=5,count=0,round=0,locked=false,completed=false,currentObject=objects[0];
const randomInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function pickQuestion(){
 const max=Number($('maxSelect').value);
 // 兩邊各至少一件，且相加不超過所選範圍。
 total=randomInt(2,max);
 left=randomInt(1,total-1);
 right=total-left;
 currentObject=objects[randomInt(0,objects.length-1)];
}
function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function say(text,finished){
 if(!('speechSynthesis' in window)){finished?.();return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang='zh-HK';u.rate=.85;
 const cantonese=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().replace('_','-')==='zh-hk');
 if(cantonese)u.voice=cantonese;
 let once=false;
 const done=()=>{if(once)return;once=true;finished?.();};
 u.onend=done;u.onerror=done;
 try{window.speechSynthesis.speak(u)}catch(e){done()}
}
function fullSentence(){return `${left}和${right}合起來，全部有${total}。`;}
function enableNext(){locked=false;completed=true;$('nextBtn').disabled=false;$('speakBtn').disabled=false;$('status').textContent='🎉 完成！現在可以按「下一題」。';}
function finishRound(myRound){
 locked=true;
 $('status').textContent='🔊 正在讀出完整句子……';
 say(String(total),()=>{
  if(myRound!==round)return;
  say(fullSentence(),()=>{if(myRound===round)enableNext();});
 });
}
function moveToBasket(el){
 if(locked||completed||!el||el.classList.contains('placed')||!el.closest('#leftBox, #rightBox'))return;
 const basket=$('basketItemsBox');
 basket.querySelector('.hint')?.remove();
 el.classList.add('placed');el.draggable=false;el.setAttribute('aria-label','已放入籃子');
 basket.appendChild(el);count++;
 // 每個物件保留自己的點數，讓學生看見 1、2、3……的對應關係。
 const iconSpan=document.createElement('span');iconSpan.className='placed-icon';iconSpan.textContent=currentObject.icon;
 const numberSpan=document.createElement('span');numberSpan.className='placed-number';numberSpan.textContent=String(count);
 el.replaceChildren(iconSpan,numberSpan);
 el.setAttribute('aria-label',`籃子內第 ${count} 個${currentObject.name}`);
 $('basketCountDisplay').textContent=count;$('resTotal').textContent=count;
 const myRound=round;
 if(count===total){finishRound(myRound)}else{say(String(count));$('status').textContent=`繼續放入大籃子：${count} / ${total}`;}
}
function makeItem(side,i){
 const el=document.createElement('button');el.type='button';el.className='item';
 el.textContent=currentObject.icon;el.setAttribute('aria-label',`${side==='left'?'左':'右'}邊第${i+1}個${currentObject.name}，點擊放入籃子`);
 el.draggable=true;el.id=`item-${round}-${side}-${i}`;
 el.addEventListener('click',()=>moveToBasket(el));
 el.addEventListener('dragstart',e=>{if(el.classList.contains('placed')){e.preventDefault();return;}e.dataTransfer.setData('text/plain',el.id)});
 return el;
}
function startRound(){
 stopVoice();round++;locked=false;completed=false;count=0;
 pickQuestion();
 $('objectName').textContent=`本題物件：${currentObject.name} ${currentObject.icon}`;
 $('leftCountDisplay').textContent=left;$('rightCountDisplay').textContent=right;
 $('resLeft').textContent=left;$('resRight').textContent=right;
 $('basketCountDisplay').textContent=0;$('resTotal').textContent=0;
 $('leftBox').replaceChildren(...Array.from({length:left},(_,i)=>makeItem('left',i)));
 $('rightBox').replaceChildren(...Array.from({length:right},(_,i)=>makeItem('right',i)));
 const hint=document.createElement('span');hint.className='hint';hint.textContent='請將上面的物件拖拉或點擊放進來';
 $('basketItemsBox').replaceChildren(hint);
 $('status').textContent='把所有物件放進大籃子，數到最後一個。';
 $('nextBtn').disabled=true;$('speakBtn').disabled=true;
}
$('basketBox').addEventListener('dragover',e=>{if(!locked&&!completed){e.preventDefault();$('basketBox').classList.add('drag-over')}});
$('basketBox').addEventListener('dragleave',e=>{if(!$('basketBox').contains(e.relatedTarget))$('basketBox').classList.remove('drag-over')});
$('basketBox').addEventListener('drop',e=>{e.preventDefault();$('basketBox').classList.remove('drag-over');moveToBasket($(e.dataTransfer.getData('text/plain')))});
$('maxSelect').addEventListener('change',startRound);
$('restartBtn').addEventListener('click',startRound);
$('nextBtn').addEventListener('click',()=>{if(completed)startRound()});
$('speakBtn').addEventListener('click',()=>{if(completed){$('nextBtn').disabled=true;$('speakBtn').disabled=true;locked=true;$('status').textContent='🔊 再讀一次……';const myRound=round;say(fullSentence(),()=>{if(myRound===round)enableNext()})}});
startRound();
</script>
</body>
</html>
