<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合起來！快樂學加法</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #222222;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 2rem;
            margin: 10px 0 20px 0;
            color: #333;
            text-align: center;
        }
        /* 老師設定區 */
        .settings-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #f9f9f9;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .settings-bar label {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .settings-bar select, .settings-bar button {
            font-size: 1.1rem;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }
        .settings-bar button {
            background: #eef2f5;
            transition: background 0.2s;
        }
        .settings-bar button:hover {
            background: #dfe5ec;
        }

        /* 遊戲主容器 */
        .game-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 上方左右兩盤 */
        .top-panels {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .panel {
            flex: 1;
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 16px;
            padding: 15px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .panel-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .text-blue { color: #0056b3; }
        .text-orange { color: #d97706; }
        .text-green { color: #16a34a; }

        .items-box {
            flex: 1;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-content: center;
            min-height: 100px;
        }

        /* 可拖拉/點擊的物件 */
        .item {
            width: 55px;
            height: 55px;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1.5px solid #bbb;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
            touch-action: none;
        }
        .item:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }
        .item.dragging {
            opacity: 0.5;
        }

        /* 下方大籃子 */
        .bottom-basket {
            background: #ffffff;
            border: 3px dashed #888;
            border-radius: 20px;
            padding: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .bottom-basket.drag-over {
            border-color: #16a34a;
            background-color: #f4fbf7;
        }
        .basket-header {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 底部結果句式區 */
        .result-banner {
            margin-top: 10px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .btn {
            font-size: 1.2rem;
            padding: 10px 24px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #eaeaea;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border-color: #1d4ed8;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }

        /* 響應式調整 */
        @media (max-width: 600px) {
            .top-panels {
                flex-direction: column;
            }
            h1 {
                font-size: 1.6rem;
            }
            .result-banner {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>合起來！學習加法概念</h1>

    <!-- 老師設定區 -->
    <div class="settings-bar">
        <label>左邊：</label>
        <select id="leftNumSelect" onchange="changePreset()">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <label>右邊：</label>
        <select id="rightNumSelect" onchange="changePreset()">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <label>物件：</label>
        <select id="iconSelect" onchange="changeIcon()">
            <option value="🍎">🍎 蘋果</option>
            <option value="🍌">🍌 香蕉</option>
            <option value="🍓">🍓 士多啤梨</option>
            <option value="🚗">🚗 車仔</option>
            <option value="🐶">🐶 小狗</option>
        </select>

        <button onclick="resetGame()">重新開始</button>
    </div>

    <!-- 遊戲區域 -->
    <div class="game-container">
        <!-- 上方左右兩盤 -->
        <div class="top-panels">
            <!-- 左盤 -->
            <div class="panel">
                <div class="panel-header">
                    左邊：<span id="leftCountDisplay" class="text-blue">3</span>
                </div>
                <div class="items-box" id="leftBox"></div>
            </div>

            <!-- 右盤 -->
            <div class="panel">
                <div class="panel-header">
                    右邊：<span id="rightCountDisplay" class="text-orange">2</span>
                </div>
                <div class="items-box" id="rightBox"></div>
            </div>
        </div>

        <!-- 下方大籃子 -->
        <div class="bottom-basket" id="basketBox" 
             ondragover="allowDrop(event)" 
             ondragleave="removeDropStyle(event)" 
             ondrop="dropItem(event)">
            <div class="basket-header">
                合起來的大籃子（已放：<span id="basketCountDisplay" class="text-green">0</span>）
            </div>
            <div class="items-box" id="basketItemsBox">
                <span style="color: #888; font-size: 1.1rem; align-self: center;">請將上面的物件拖拉或點擊放進來</span>
            </div>
        </div>

        <!-- 結果句式顯示區 -->
        <div class="result-banner" id="resultBanner">
            <span id="resLeft" class="text-blue">3</span> 和 
            <span id="resRight" class="text-orange">2</span> 合起來，全部有 
            <span id="resTotal" class="text-green">0</span>。
        </div>

        <!-- 操作按鈕 -->
        <div class="action-btns">
            <button class="btn" onclick="speakResultAgain()">🔊 再讀一次</button>
            <button class="btn btn-primary" onclick="resetGame()">🔄 下一題</button>
        </div>
    </div>

    <script>
        let currentIcon = "🍎";
        let targetLeft = 3;
        let targetRight = 2;
        let basketCount = 0;
        let totalTarget = 5;

        // 初始化
        window.onload = function() {
            resetGame();
        };

        function changePreset() {
            targetLeft = parseInt(document.getElementById('leftNumSelect').value);
            targetRight = parseInt(document.getElementById('rightNumSelect').value);
            totalTarget = targetLeft + targetRight;
            resetGame();
        }

        function changeIcon() {
            currentIcon = document.getElementById('iconSelect').value;
            resetGame();
        }

        function resetGame() {
            basketCount = 0;
            totalTarget = targetLeft + targetRight;

            // 更新畫面上數字顯示
            document.getElementById('leftCountDisplay').innerText = targetLeft;
            document.getElementById('rightCountDisplay').innerText = targetRight;
            document.getElementById('basketCountDisplay').innerText = basketCount;
            
            document.getElementById('resLeft').innerText = targetLeft;
            document.getElementById('resRight').innerText = targetRight;
            document.getElementById('resTotal').innerText = basketCount;

            // 清空並重新生成左盤物件
            const leftBox = document.getElementById('leftBox');
            leftBox.innerHTML = '';
            for (let i = 0; i < targetLeft; i++) {
                let item = createItemElement('left', i);
                leftBox.appendChild(item);
            }

            // 清空並重新生成右盤物件
            const rightBox = document.getElementById('rightBox');
            rightBox.innerHTML = '';
            for (let i = 0; i < targetRight; i++) {
                let item = createItemElement('right', i);
                rightBox.appendChild(item);
            }

            // 清空大籃子
            const basketItemsBox = document.getElementById('basketItemsBox');
            basketItemsBox.innerHTML = '<span style="color: #888; font-size: 1.1rem; align-self: center;">請將上面的物件拖拉或點擊放進來</span>';
        }

        function createItemElement(source, index) {
            let div = document.createElement('div');
            div.className = 'item';
            div.innerText = currentIcon;
            div.draggable = true;
            div.id = source + '-' + index + '-' + Date.now();

            // 拖拉事件
            div.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', div.id);
                setTimeout(() => div.classList.add('dragging'), 0);
            });
            div.addEventListener('dragend', () => {
                div.classList.remove('dragging');
            });

            // 點擊直接移動事件（方便觸控或滑鼠點擊）
            div.addEventListener('click', () => {
                moveToBasket(div);
            });

            return div;
        }

        function allowDrop(e) {
            e.preventDefault();
            document.getElementById('basketBox').classList.add('drag-over');
        }

        function removeDropStyle(e) {
            document.getElementById('basketBox').classList.remove('drag-over');
        }

        function dropItem(e) {
            e.preventDefault();
            document.getElementById('basketBox').classList.remove('drag-over');
            let id = e.dataTransfer.getData('text/plain');
            let item = document.getElementById(id);
            if (item) {
                moveToBasket(item);
            }
        }

        function moveToBasket(item) {
            // 如果是大籃子入面嘅提示文字，先清空
            const basketItemsBox = document.getElementById('basketItemsBox');
            if (basketItemsBox.querySelector('span')) {
                basketItemsBox.innerHTML = '';
            }

            // 移動到大籃子
            basketItemsBox.appendChild(item);
            item.draggable = false; // 入咗籃就唔好再拖走

            basketCount++;
            document.getElementById('basketCountDisplay').innerText = basketCount;
            document.getElementById('resTotal').innerText = basketCount;

            // 語音讀出當前點數
            speakText(basketCount.toString());

            // 檢查係唔係已經全部放晒落去
            if (basketCount === totalTarget) {
                setTimeout(() => {
                    let fullSentence = `${targetLeft}和${targetRight}合起來，全部有${totalTarget}。`;
                    speakText(fullSentence);
                }, 400);
            }
        }

        // 廣東話語音合成函數
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止之前未講完嘅
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.9; // 稍為減慢，適合學生聆聽
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakResultAgain() {
            let fullSentence = `${targetLeft}和${targetRight}合起來，全部有${basketCount}。`;
            speakText(fullSentence);
        }
    </script>
</body>
</html>
